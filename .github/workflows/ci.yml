name: Release gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-check:
    name: Hardening · Tests · Build · Browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run release candidate gate
        run: pnpm release:check

      - name: Generate release supply-chain artifacts
        if: ${{ success() }}
        run: pnpm release:artifacts

      - name: Package deployable bytes
        if: ${{ success() }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          short_sha=${GITHUB_SHA::7}
          source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")
          mkdir -p artifacts/deployment
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "artifacts/deployment/bodegix-pos-${version}-${short_sha}.tar.gz" \
            -C .vercel/output/static .
          sha256sum "artifacts/deployment/bodegix-pos-${version}-${short_sha}.tar.gz" \
            > "artifacts/deployment/bodegix-pos-${version}-${short_sha}.tar.gz.sha256"

      - name: Upload production build
        uses: actions/upload-artifact@v4
        if: ${{ success() }}
        with:
          name: vercel-build-output
          path: .vercel/output/
          include-hidden-files: true
          retention-days: 30

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-evidence
          path: |
            artifacts/release/
            artifacts/deployment/
            playwright-report/
            test-results/
          retention-days: 14
