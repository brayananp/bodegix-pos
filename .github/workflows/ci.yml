name: Release gate

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  release-check:
    name: Hardening · Tests · Build · Browser matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies from frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run release candidate gate
        run: pnpm release:check

      - name: Generate release supply-chain artifacts
        if: ${{ !cancelled() }}
        run: pnpm release:artifacts

      - name: Upload production build
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: production-output
          path: .output/
          retention-days: 7

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-evidence
          path: |
            artifacts/release/
            playwright-report/
            test-results/
          retention-days: 14
